# fly.toml app configuration file generated for uhuru on 2026-08-01T16:52:10-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Two deployment profiles, toggled by hand (this repo auto-deploys on every
# push to main via .github/workflows/fly-deploy.yml, so whichever profile is
# committed here is what actually ships):
#
#   FULL (current):  local model bundled (Granville + Gemma 3 4B), needs the
#                     granville_models volume + a dedicated vCPU/8GB. Costs
#                     real money even at low usage -- see README's
#                     self-hosting cost section for the numbers.
#   LEAN:             Together-only, no local model, no volume. To switch:
#                       1. remove GRANVILLE_MODEL_URL / GRANVILLE_MODEL_PATH
#                          from [env] below
#                       2. remove the [[mounts]] block
#                       3. change [[vm]] back to:
#                            cpu_kind = 'shared'
#                            cpus = 1
#                            memory = '1gb'
#                     Costs a couple dollars/month at low usage, no
#                     dedicated CPU required.

app = 'uhuru'
primary_region = 'dfw'
kill_signal = 'SIGTERM'

[build]
[env]
  # No persistent volume for the DB: Litestream restores this from Tigris
  # on every boot and streams writes back continuously (see litestream.sh).
  # An ephemeral path is intentional, not an oversight.
  DATABASE_PATH = '/tmp/uhuru.db'
  PHX_HOST = 'uhuru.fly.dev'
  PORT = '8080'
  # Local model, cached on the granville_models volume so it downloads once,
  # not on every wake. bartowski's community GGUF -- Google's own repo is
  # gated/auth-required, this one isn't. ~2.49GB, verified reachable.
  GRANVILLE_MODEL_URL = 'https://huggingface.co/bartowski/google_gemma-3-4b-it-GGUF/resolve/main/google_gemma-3-4b-it-Q4_K_M.gguf'
  GRANVILLE_MODEL_PATH = '/data/gemma-3-4b-it-Q4_K_M.gguf'

[[mounts]]
  source = 'granville_models'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  size = 'performance-1x'
  memory = '8gb'
